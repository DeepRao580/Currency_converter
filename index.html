<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="Currency_Converter.css">
</head>
<body>
    <div class="container">
        <h2>CURRENCY CONVERTER</h2>
        <form>
            <div class="amount">
                <p>Enter Amount:</p>
                <input type="text" placeholder="Amount">
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>From</p>
                    <div class="main">
                    <img src="https://flagsapi.com/US/flat/64.png" class="fromimg">
                    <select name="from"></select>
                    </div>
                </div>
                <button class="into" type="button">
                    <img src="Arrow.png">
                </button>
                <div class="to">
                    <p>To</p>
                    <div class="main">
                    <img src="https://flagsapi.com/IN/flat/64.png" class="toimg">
                    <select name="to"></select>
                    </div>
                </div>
            </div>
        </form>
        <div class="message">
        </div>
        <button class="exc">
            Get Exchange Rate
        </button>
    </div>
    <script src="Currency_Converter.js"></script>
    <script src="Country_codes.js"></script>
</body>

</html>
